# Golden set v1 (2026-10-19): drafted by Claude from page TITLES only (`documents --titles`), to be
# checked by Ignasi. Expected pages = the run of slides whose title is that topic, so they may be
# a bit wide. If `eval` lists a question as not found, open its top result and the expected pages
# with `inspect <file> --page N`: fix the question or the pages here, not the code.
questions:
