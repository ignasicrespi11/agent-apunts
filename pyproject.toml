[project]
name = "agent-apunts"
version = "0.1.0"
description = "RAG agent over university notes that answers with citations to the professors' material."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "py3langid>=0.4.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
agent-apunts = "agent_apunts.cli:app"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
