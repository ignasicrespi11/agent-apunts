# Shared settings: identical on every machine, committed to git.
# Machine-specific values (paths, URLs) and secrets live in .env instead (see .env.example).
# Loaded and validated by src/agent_apunts/config.py: a typo in a key is an error at startup.

# The single user for now. user_id is passed explicitly through the code (never a global),
# so multi-user later only changes where this value comes from (D7).
user:
  id: ignasi
  university: UAB
  degree: Computer Engineering

# Languages the material is written in. Language detection (D16) only chooses among these:
# restricting the candidates makes detection on short slide text far more reliable.
languages: [ca, es, en]

# Stage outputs (manifest, processed JSON, thumbnails). Gitignored: derived from copyrighted PDFs.
data_dir: data

extraction:
  # Pages with fewer characters than this are flagged "mostly image" (D14).
  image_page_max_chars: 80
  # Thumbnail width in pixels (height keeps the page's aspect ratio).
  thumbnail_width: 320
  # Language detection (D16) needs enough text: shorter pages ("Tema 3") get no language,
  # and so do pages where the detector is less sure than this (0-1).
  language_min_chars: 20
  language_min_confidence: 0.8
  # `images` report (D30): a page with text whose images cover at least this share of it probably
  # holds content we don't read (code screenshots, diagrams).
  large_image_min_coverage: 0.25

# Stage 3, CLEAN (D27): a line is boilerplate (logo text, footer, course name) when it appears on at
# least this share of a document's pages, on at least this many pages, and is short. Digits are
# ignored when comparing ("Page 3" == "Page 4"). Bare page numbers are always removed.
cleaning:
  repeated_line_min_share: 0.5
  repeated_line_min_pages: 3
  repeated_line_max_chars: 100

# Stage 4, CHUNK (D26): size decides. A page up to max_words is one chunk; longer pages are cut at
# paragraph (then line) boundaries into chunks of about target_words, never above max_words.
# Pages with fewer than min_words words produce no chunk (images, blank pages: D14, D29).
chunking:
  max_words: 450
  target_words: 350
  min_words: 5

# Stage 5, INDEX (D28). The SAME model must embed chunks and queries: the name and dimension are
# also stored in the Qdrant collection, and indexing refuses to mix models.
embedding:
  provider: ollama
  model: bge-m3  # BAAI/bge-m3 as served by Ollama: `ollama pull bge-m3`
  dimension: 1024
  batch_size: 32

qdrant:
  collection: apunts

# Retrieval for `ask` (D32). min_score is provisional: calibrate it with `agent-apunts eval --sweep`.
# If the best chunk scores below it, `ask` abstains without calling the LLM.
retrieval:
  top_k: 5
  min_score: 0.45

# Local LLM via Ollama (D4, D31): `ollama pull qwen2.5:7b`. Provisional model, chosen with the eval.
# temperature 0: repeatable answers (eval). num_ctx: tokens the model sees (5 sources + rules fit).
llm:
  provider: ollama
  model: qwen2.5:7b
  temperature: 0
  num_ctx: 8192

# Metadata auto-detection (D36, proposed). A document is assigned to the subject whose centroid
# (mean vector of its labelled documents) is closest; the guess counts as confident only if it
# beats the second-best subject by at least min_margin (cosine). Calibrate with `detect --evaluate`.
# Vectors come from up to sample_chunks chunks of plain text (no header: the header contains the
# subject's name, which unorganised PDFs don't have; using it would fake a perfect accuracy).
detection:
  min_margin: 0.05
  sample_chunks: 6

# Query log (D33): one JSON line per question, with user_id. Gitignored: it contains your questions.
logs_dir: logs
